name: Signed Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag/branch) to build from'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    name: Build & sign F-Droid release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set. See the comment at the top of this workflow for setup steps."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write signing.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > signing.properties <<PROPS
          STORE_FILE=$RUNNER_TEMP/release.jks
          STORE_PASSWORD=$STORE_PASSWORD
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASSWORD
          PROPS

      - name: Build signed F-Droid release APK
        run: ./gradlew assembleFdroidRelease --stacktrace

      - name: Clean up keystore and signing properties
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" signing.properties

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: Amaze-Fdroid-release-signed
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          if-no-files-found: error

      - name: Upload R8/ProGuard mapping
        uses: actions/upload-artifact@v7
        with:
          name: Amaze-Fdroid-release-mapping
          path: app/build/outputs/mapping/fdroidRelease/mapping.txt
          if-no-files-found: ignore

      - name: Attach APK to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "app/build/outputs/apk/fdroid/release/app-fdroid-release.apk" \
            --clobber

# Setup (one-time, from Termux or any device with a JDK installed):
#   1. Generate a keystore if you don't already have one:
#      keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 \
#        -validity 10000 -alias amaze-release
#   2. Base64-encode it on one line and copy the output:
#      base64 -w0 release.jks
#   3. In GitHub: Settings > Secrets and variables > Actions, add these repo secrets:
#        RELEASE_KEYSTORE_BASE64   <- output of step 2
#        RELEASE_KEYSTORE_PASSWORD <- the keystore password
#        RELEASE_KEY_ALIAS         <- e.g. amaze-release
#        RELEASE_KEY_PASSWORD      <- the key password
#   4. Keep release.jks somewhere safe (e.g. an encrypted folder) - losing it means
#      you can never publish an update signed with the same identity again.
#
# This workflow only signs the "fdroid" flavor. The "play" flavor uses a separate
# signingConfigs.config block in app/build.gradle that this source snapshot never
# populates (likely wired up privately in upstream's own CI), so building
# assemblePlayRelease here will fail until you configure that config the same way.
