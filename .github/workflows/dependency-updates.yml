name: Check dependency updates

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'

jobs:
  check-updates:
    name: Run dependencyUpdates report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check for outdated dependencies
        run: ./gradlew dependencyUpdates --no-parallel --stacktrace

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates-report
          path: build/dependencyUpdates/
          if-no-files-found: warn

      - name: Add report to job summary
        if: always()
        run: |
          {
            echo "### Dependency updates report"
            echo
            echo '```'
            cat build/dependencyUpdates/report.txt 2>/dev/null || echo "No report was generated."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
