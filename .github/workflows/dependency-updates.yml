name: Check dependency updates

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'

jobs:
  check-updates:
    name: Run dependencyUpdates report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: "temurin"
          java-version: 17

      - name: Set up NDK
        uses: nttld/setup-ndk@6a7e9c5494b25a37d1c4d2f13ddd0c44569ece22 # v1.5.0
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Check for outdated dependencies
        run: ./gradlew dependencyUpdates --no-parallel --stacktrace

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-updates-report
          path: build/dependencyUpdates/
          if-no-files-found: warn

      - name: Add report to job summary
        if: always()
        run: |
          {
            echo "### Dependency updates report"
            echo
            echo '```'
            cat build/dependencyUpdates/report.txt 2>/dev/null || echo "No report was generated."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
