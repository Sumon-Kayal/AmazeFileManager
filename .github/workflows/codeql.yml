name: "CodeQL"

on:
  push:
    branches:
      - 'master'
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - 'master'
      - 'release/*'
      - 'hotfix/*'
  schedule:
    # 03:21 UTC every Thursday - off-the-hour to avoid GitHub's scheduling crunch
    - cron: '21 3 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Covers app/, file_operations' Kotlin/Java side, portscanner, commons_compress_7z.
          # Needs an actual build (autobuild can't handle this multi-module + native setup
          # reliably), so we drive it manually with the same command the rest of CI uses.
          - language: java-kotlin
            build-mode: manual
          # The Rust side of file_operations. build-mode: none reads the source directly,
          # no Android cross-compile toolchain required.
          - language: rust
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Set up NDK
        if: matrix.language == 'java-kotlin'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true

      - name: Install Rust
        if: matrix.language == 'java-kotlin'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Rust for Android
        if: matrix.language == 'java-kotlin'
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build (debug variants only, matches the rest of CI)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew assembledebug --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
